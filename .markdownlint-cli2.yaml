# markdownlint-cli2 configuration for atlas-specs (ATLAS-001 FR-07, S-10).
# Runs via the digest-pinned image in tools/images.lock (`make docs-lint`).
# Approved baselines are excluded and are NEVER edited to satisfy lint (spec FR-07).
ignores:
  - "brd/**"
  - "ux/**"
  - "technical/**"
  - "**/.venv/**"
  - "**/node_modules/**"
config:
  default: true
  # House style uses wide tables whose rows cannot be wrapped in Markdown.
  MD013: false
  # House style writes table delimiter rows as `|---|`; GitHub renders this identically
  # to `| --- |`. Disabled rather than reformatting approved documents for lint.
  MD060: false
  # Line breaks inside table cells are written as <br>; no other inline HTML is allowed.
  MD033:
    allowed_elements: [br]
  # House style puts italic reference lines (e.g. *Tech §17.8 #1 · FR-…*) under headings;
  # they are not headings.
  MD036: false
