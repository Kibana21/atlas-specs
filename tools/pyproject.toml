[project]
name = "atlas-specs-tools"
version = "0.1.0"
description = "CI validation tooling for atlas-specs (not product code; never deployed)."
requires-python = "==3.12.*"
# Pinning policy (DEC-020 modification applied to tooling): lower bound = verified version,
# upper bound below the next major (next minor for 0.x); exact versions in uv.lock.
dependencies = [
    "pyyaml>=6.0.3,<7",
    "jsonschema>=4.26.0,<5",
    "check-jsonschema>=0.38.2,<0.39",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["docker: test needs the pinned oasdiff container (Docker)"]
