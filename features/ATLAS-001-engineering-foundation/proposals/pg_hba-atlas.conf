# =============================================================================
# ATLAS-001 — OPTIONAL local hardening for the shared Homebrew PostgreSQL 15 (DEC-084)
# STATUS: PROPOSAL — NOT APPLIED. Owner decision; changes a shared server's config.
#
# Effect: applies ONLY to the four Atlas roles. Every other user and project keeps
# today's behaviour (the existing `trust` lines below these are untouched).
#   1. Atlas roles must authenticate with scram-sha-256 (passwords become enforced).
#   2. Atlas roles may connect ONLY to atlas_db / atlas_test; any other database
#      (`postgres` and every other project's database) is rejected for them.
#
# How to apply (owner):
#   1. Back up:  cp /opt/homebrew/var/postgresql@15/pg_hba.conf{,.bak-atlas}
#   2. Insert the six lines below ABOVE the first existing rule (first match wins).
#   3. Reload:   psql -h localhost -d postgres -c 'SELECT pg_reload_conf();'
#   4. Check:    psql -h localhost -d postgres -c "SELECT line_number, type, database, user_name, auth_method, error FROM pg_hba_file_rules ORDER BY line_number LIMIT 8;"
# Rollback: restore the .bak-atlas file and reload.
#
# Validated 2026-10-24 in a disposable postgres:15-alpine container (spec §6.2).
# =============================================================================
# TYPE  DATABASE             USER                                                         ADDRESS        METHOD
local   atlas_db,atlas_test  atlas_migrator,atlas_app,atlas_test_migrator,atlas_test_app                  scram-sha-256
host    atlas_db,atlas_test  atlas_migrator,atlas_app,atlas_test_migrator,atlas_test_app  127.0.0.1/32   scram-sha-256
host    atlas_db,atlas_test  atlas_migrator,atlas_app,atlas_test_migrator,atlas_test_app  ::1/128        scram-sha-256
local   all                  atlas_migrator,atlas_app,atlas_test_migrator,atlas_test_app                  reject
host    all                  atlas_migrator,atlas_app,atlas_test_migrator,atlas_test_app  127.0.0.1/32   reject
host    all                  atlas_migrator,atlas_app,atlas_test_migrator,atlas_test_app  ::1/128        reject
